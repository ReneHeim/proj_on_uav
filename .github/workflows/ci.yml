name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest tests/ -q -k 'not e2e'
      - run: python -m build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: python -m pip install --upgrade pip pytest pytest-cov
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: >-
          python -m pytest tests/ -q --tb=short --durations=20
          --cov=oncerco_uav --cov-report=xml --cov-report=term-missing
          --cov-fail-under=95
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
